name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Configura um container de banco de dados isolado para o teste
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cfm_db_test
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
        ports:
          - 5432:5432
        # Health check para garantir que o banco subiu antes de rodar o Java
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache:maven: true # Habilita cache das dependências para ser mais rápido

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Build e Testes
        env:
          # Sobrescreve as variáveis do application.properties para usar o banco do teste
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cfm_db_test
          SPRING_DATASOURCE_USERNAME: user_test
          SPRING_DATASOURCE_PASSWORD: password_test
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: ./mvnw clean verify